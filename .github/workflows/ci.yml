name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Solidity: build, format, lint, unit/integration/fuzz/invariant tests.
  # ---------------------------------------------------------------------------
  foundry:
    name: Foundry (build, lint, test)
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish the coverage badge branch
    steps:
      - name: Check out repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show versions
        run: |
          forge --version
          cast --version

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Lint
        run: forge lint

      - name: Run tests
        run: forge test -vvv

      - name: Generate coverage (lcov)
        run: forge coverage --report lcov

      - name: Compute coverage badge
        run: bash scripts/coverage-badge.sh lcov.info badge/coverage.json

      - name: Publish coverage badge (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publish-badge.sh badges coverage.json "$(cat badge/coverage.json)"

  # ---------------------------------------------------------------------------
  # Verity (Lean 4): overlay the model into a pinned Verity checkout and
  # machine-check the proofs, then compile the model to Yul.
  # ---------------------------------------------------------------------------
  verity:
    name: Verity (Lean proofs + Yul)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write # needed to publish the verification badge branch
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lean toolchain, Mathlib and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            ~/.cache/mathlib
            verity/.lake
          key: verity-${{ runner.os }}-${{ hashFiles('verity/lakefile.lean', 'verity/lean-toolchain') }}-${{ hashFiles('verity/Migraine/**', 'verity/Migraine.lean', 'scripts/ci-verity.sh') }}
          restore-keys: |
            verity-${{ runner.os }}-${{ hashFiles('verity/lakefile.lean', 'verity/lean-toolchain') }}-

      - name: Build, gate and compile (self-contained verity/ package)
        run: bash scripts/ci-verity.sh

      - name: Upload generated Yul artifact
        uses: actions/upload-artifact@v4
        with:
          name: Migraine-yul
          path: verity/artifacts/yul/Migraine.yul
          if-no-files-found: error

      - name: Publish verification badge — passing (main only)
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publish-badge.sh badges-verification verification.json \
            '{"schemaVersion":1,"label":"formal verification","message":"passing","color":"brightgreen"}'

      - name: Publish verification badge — failing (main only)
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publish-badge.sh badges-verification verification.json \
            '{"schemaVersion":1,"label":"formal verification","message":"failing","color":"critical"}'
